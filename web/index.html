<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenPlan</title>
    <script>
      // Apply the stored theme before first paint so dark mode does not flash light.
      // Keep these rules in step with ThemeProvider.
      ;(function () {
        var theme = null
        try {
          theme = window.localStorage.getItem("openplan-theme")
        } catch {
          // Storage can be blocked; fall back to the system preference like ThemeProvider.
        }
        if (
          theme === "dark" ||
          (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark")
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
