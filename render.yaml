services:
  - type: web
    name: openplan-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENPLAN_PUBLIC_URL
        sync: false
      - key: OPENPLAN_LOG
        value: info
      # Assumed: Vercel replaces X-Forwarded-For with the client address and Render appends the address
      # it received from Vercel, so the client is the second entry from the right. Verify after the first
      # deploy (docs/deploy.md). The Render URL is public, so a direct caller can forge the header; the
      # per-email login ceiling (50 attempts per 15 minutes, any address) limits guessing in that case.
      - key: OPENPLAN_TRUSTED_PROXY_HOPS
        value: "2"
