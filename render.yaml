services:
  - type: web
    name: openplan-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENPLAN_PUBLIC_URL
        sync: false
      - key: OPENPLAN_LOG
        value: info
      # Render's proxy appends the address it received, so the client is the rightmost
      # X-Forwarded-For entry. Use 2 if a Vercel deployment of web/ proxies /api to this service.
      - key: OPENPLAN_TRUSTED_PROXY_HOPS
        value: "1"
