services:
  - type: web
    name: openplan-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENPLAN_PUBLIC_URL
        sync: false
      - key: OPENPLAN_LOG
        value: info
      # Vercel replaces X-Forwarded-For with the client address and Render appends the address it
      # received from Vercel, so the client is the second entry from the right. The Render URL is
      # public, so a direct caller can forge the header; the per-email login ceiling (50 attempts per
      # 15 minutes, any address) limits guessing in that case. See docs/deploy.md.
      - key: OPENPLAN_TRUSTED_PROXY_HOPS
        value: "2"
